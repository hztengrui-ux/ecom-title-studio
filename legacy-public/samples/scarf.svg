<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="美利奴羊毛纯色长围巾示例图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EADB"/>
      <stop offset="0.6" stop-color="#EADCC7"/>
      <stop offset="1" stop-color="#D9C4A7"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8C2A4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#C4AA88" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C97B5C"/>
      <stop offset="0.5" stop-color="#B55F45"/>
      <stop offset="1" stop-color="#94452F"/>
    </linearGradient>
    <linearGradient id="woolLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D88E6E"/>
      <stop offset="1" stop-color="#A9523A"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8C4A8"/>
      <stop offset="1" stop-color="#B99C78"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D9BF"/>
      <stop offset="1" stop-color="#CDB392"/>
    </linearGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="woolTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
    </filter>
    <clipPath id="scarfClip">
      <rect x="-380" y="-105" width="760" height="250" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <path d="M180 120 L1020 120 L1020 760 Q600 620 180 760 Z" fill="url(#arch)" opacity="0.5"/>
  <path d="M0 880 C300 858 820 866 1200 840 L1200 1200 L0 1200 Z" fill="url(#table)"/>
  <path d="M0 880 C300 858 820 866 1200 840" fill="none" stroke="#F1E2CB" stroke-opacity="0.5" stroke-width="3"/>

  <path d="M120 300 C190 250 250 256 300 300" fill="none" stroke="#8F7554" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M152 330 C220 288 270 292 318 332" fill="none" stroke="#8F7554" stroke-opacity="0.2" stroke-width="2"/>
  <g fill="#8F7554" opacity="0.26">
    <ellipse cx="190" cy="270" rx="14" ry="5" transform="rotate(-28 190 270)"/>
    <ellipse cx="242" cy="258" rx="12" ry="4" transform="rotate(18 242 258)"/>
    <ellipse cx="286" cy="286" rx="13" ry="4.5" transform="rotate(-12 286 286)"/>
  </g>

  <ellipse cx="590" cy="790" rx="360" ry="46" fill="#6D5136" opacity="0.24" filter="url(#blur18)"/>

  <g transform="translate(600 610) rotate(-13)">
    <rect x="-372" y="-92" width="744" height="236" rx="30" fill="#7E3927" opacity="0.18" filter="url(#blur6)"/>
    <rect x="-380" y="-105" width="760" height="250" rx="30" fill="url(#wool)"/>
    <g clip-path="url(#scarfClip)">
      <rect x="-380" y="-38" width="760" height="26" fill="#EFE1C9" opacity="0.72"/>
      <rect x="-380" y="42" width="760" height="16" fill="#EFE1C9" opacity="0.55"/>
      <rect x="-380" y="94" width="760" height="8" fill="#EFE1C9" opacity="0.35"/>
      <path d="M-380 70 Q-100 30 160 62 T 380 54" fill="none" stroke="#7B3625" stroke-opacity="0.22" stroke-width="4"/>
      <path d="M-380 140 Q-80 110 180 132 T 380 124" fill="none" stroke="#F6E8D2" stroke-opacity="0.2" stroke-width="3"/>
      <path d="M-330 -110 Q-300 10 -330 150" fill="none" stroke="#F2C9AD" stroke-opacity="0.16" stroke-width="8"/>
    </g>
    <rect x="-340" y="-184" width="680" height="104" rx="24" fill="url(#woolLight)"/>
    <rect x="-340" y="-142" width="680" height="18" fill="#EFE1C9" opacity="0.62"/>
    <path d="M-340 -120 Q0 -92 340 -120" fill="none" stroke="#7B3625" stroke-opacity="0.22" stroke-width="4"/>
    <path d="M-300 -184 Q-250 -104 -230 -42" fill="none" stroke="#F6D6C2" stroke-opacity="0.15" stroke-width="7"/>

    <g stroke="#B55F45" stroke-width="5" stroke-linecap="round">
      <path d="M380 -86 L432 -92"/>
      <path d="M380 -63 L438 -68"/>
      <path d="M380 -40 L432 -44"/>
      <path d="M380 -17 L438 -20"/>
      <path d="M380 6 L432 4"/>
      <path d="M380 29 L438 28"/>
      <path d="M380 52 L432 52"/>
      <path d="M380 75 L438 76"/>
      <path d="M380 98 L432 100"/>
      <path d="M380 121 L438 124"/>
    </g>
    <path d="M-160 150 C-120 220 -100 300 -150 360" fill="none" stroke="#B55F45" stroke-width="74" stroke-linecap="round"/>
    <path d="M-160 150 C-120 220 -100 300 -150 360" fill="none" stroke="#E9D7BC" stroke-opacity="0.34" stroke-width="16" stroke-linecap="round"/>
    <path d="M-150 350 L-164 402" stroke="#B55F45" stroke-width="7" stroke-linecap="round"/>
    <path d="M-136 352 L-140 406" stroke="#B55F45" stroke-width="7" stroke-linecap="round"/>
    <path d="M-122 354 L-116 404" stroke="#B55F45" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g>
    <ellipse cx="952" cy="1004" rx="120" ry="18" fill="#5C422C" opacity="0.24" filter="url(#blur18)"/>
    <rect x="844" y="868" width="216" height="128" rx="8" fill="url(#box)"/>
    <path d="M844 906 L1060 906" stroke="#B55F45" stroke-opacity="0.6" stroke-width="18"/>
    <path d="M944 868 L944 996" stroke="#B55F45" stroke-opacity="0.6" stroke-width="18"/>
    <path d="M944 868 C900 820 858 846 890 880" fill="none" stroke="#A9523A" stroke-width="12"/>
    <path d="M944 868 C988 820 1030 846 998 880" fill="none" stroke="#A9523A" stroke-width="12"/>
    <rect x="844" y="868" width="216" height="128" rx="8" fill="none" stroke="#9E7A54" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <rect width="1200" height="1200" filter="url(#woolTexture)" opacity="0.5"/>
</svg>
