<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="轻量便携户外折叠月亮椅示例图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6D6C4"/>
      <stop offset="0.55" stop-color="#E6E2D0"/>
      <stop offset="1" stop-color="#F3E8D3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F6DFAE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6DFAE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B28A"/>
      <stop offset="1" stop-color="#A88961"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B8866"/>
      <stop offset="0.5" stop-color="#5E6D50"/>
      <stop offset="1" stop-color="#45533C"/>
    </linearGradient>
    <linearGradient id="fabricSeat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68775A"/>
      <stop offset="1" stop-color="#3E4B36"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C211A"/>
      <stop offset="0.5" stop-color="#4B5044"/>
      <stop offset="1" stop-color="#181C16"/>
    </linearGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <clipPath id="backClip">
      <path d="M405 392 Q600 320 795 392 L758 676 Q600 738 442 676 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#sky)"/>
